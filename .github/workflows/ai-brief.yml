name: ai-brief

# One short bilingual brief, twice a day, from data this project already publishes.
#
# WHY TWICE A DAY. AGENTS.md allows an LLM only if it is low-frequency and small-context, and
# requires the frequency and the context size to be reported before it is added. Reported to
# Cyrus 2026-10-01; he cut the proposed hourly cadence to this. Current shape:
#
#   frequency  2/day, 08:00 and 20:00 HKT (00:00 and 12:00 UTC)
#   context    928 bytes measured - five files, the fields named in SOURCES
#   output     data/ai_summary.json, force-pushed to `live-data` like every other live file
#   runtime    NO model call. The browser fetches a static JSON file; there is no key in the
#              bundle and no per-visitor request to any LLM.
#
# The key is a repository secret, never a committed value (the repo is public). If it is missing
# the script exits non-zero rather than publishing an empty panel - a panel that renders "no
# summary" for a reason nobody can see is the failure this project treats as worse than a red run.
#
# The OpenRouter key must be allowed to call a NAMED free model. Do NOT restrict it to the auto
# router: `openrouter/auto` chooses a model itself, which can be a paid one, and a request that
# names a model is refused outright by an auto-only key - so the restriction meant to save money
# breaks the job. A named `:free` model costs nothing, which is the property actually wanted.
on:
  # Two SLOTS a day, each with a second attempt half an hour later. The script skips its own
  # model call when the published brief is under 6 hours old, so the second attempt only does
  # work when the first one failed on a busy shared pool - the published frequency stays the
  # two-a-day that was reported.
  schedule:
    - cron: "0 0,12 * * *"
    - cron: "30 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    env:
      HKCM_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Cyruschu430/hk-city-monitor.git
    steps:
      - uses: actions/checkout@v4

      - name: Build the brief (fetches live-data, calls the model, refuses to publish empty)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HKCM_AI_MODEL: ${{ vars.HKCM_AI_MODEL }}
        run: python3 scripts/build_ai_summary.py --skip-if-fresh 6 --out data/ai_summary.json

      # THE BRANCH IS FORCE-PUSHED AS ONE ORPHAN COMMIT, so a file that is not named here is
      # DELETED from it. Calling publish_live.py with ai_summary.json alone would have taken the
      # aircraft, berth and water panels down - and the checkout this job runs in holds the
      # COMMITTED snapshots of those three, which are up to a week old, so simply naming them
      # would have replaced live values with stale ones. Fetch the current copies first, and
      # refuse to publish at all if any of them cannot be fetched: publishing nothing costs a
      # stale brief, publishing without them costs three panels.
      - name: Publish it to the live-data branch, with the files it is not responsible for
        run: |
          set -eu
          for f in aircraft.json berth_vacancy.json water_suspension.json; do
            curl -sfL "https://raw.githubusercontent.com/Cyruschu430/hk-city-monitor/live-data/$f" -o "data/$f" \
              || { echo "REFUSING to publish: $f could not be fetched, and the force-push would delete it"; exit 1; }
          done
          python3 scripts/publish_live.py data/aircraft.json data/berth_vacancy.json data/water_suspension.json data/ai_summary.json

      - name: Print what was published
        run: python3 -c "import json;d=json.load(open('data/ai_summary.json',encoding='utf-8'));print('model',d['model']);print('tc',d['brief']['tc']);print('en',d['brief']['en'])"
