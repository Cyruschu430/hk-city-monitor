name: ci

# The front end ships as static files, so there is no service to smoke-test after a
# deploy. What can rot silently is the build, the parsers and the counts the public
# documents claim. Those are what this runs.
#
# Scoped to master and pull requests on purpose: the live collectors push to the
# `live-data` branch every 10 minutes, which would otherwise start 144 runs a day.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Unit tests
        run: npm test
        working-directory: web

      - name: Data registry consistency
        run: python3 scripts/validate_config.py

      - name: Documented counts match the registries
        run: python3 scripts/check_doc_counts.py

      # A reference snapshot that nobody refreshes is a panel that is right once and wrong
      # forever. This reads the last COMMIT date of each one, which survives a clone.
      - name: Reference snapshots are inside their cadence
        run: python3 scripts/check_snapshot_age.py

  # The deliverable is the site, so the deploy is the last step of the same run — pushed to master
  # and gated on `check`, so a red commit never reaches the public URL. Cloudflare Pages rather than
  # GitHub Pages: the edge worker and the `live-data` branch are already on that account, and
  # pages-build-deployment (GitHub's own, unused) still runs on every push in parallel.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          # overlays3d.ts throws without it. The worker URL is public, so it is configuration,
          # not a secret — the only real secret here is the Cloudflare token.
          VITE_WORKER_BASE: https://hk-city-monitor.cyrus738.workers.dev

      # A missing basemap/style.json does not fail anything by itself: Pages answers the request
      # with the SPA's index.html, MapLibre throws on the HTML, and the map plus every layer on it
      # silently disappears in production (measured 2026-10-22). Fail here, on the artefact that is
      # about to ship, instead of on a user's screen.
      - name: Verify the built artefact carries a usable basemap style
        run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("dist/basemap/style.json", "utf8");
            if (raw.trimStart().startsWith("<")) throw new Error("dist/basemap/style.json is HTML, not JSON");
            const s = JSON.parse(raw);
            if (!s.sources || Object.keys(s.sources).length === 0) throw new Error("basemap style has no sources");
            if (!Array.isArray(s.layers) || s.layers.length === 0) throw new Error("basemap style has no layers");
            console.log("basemap style ok:", Object.keys(s.sources).length, "sources,", s.layers.length, "layers");
          '
        working-directory: web

      - name: Deploy
        run: npx --yes wrangler@4.147.0 pages deploy dist --project-name=hk-city-monitor --branch=main
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The other half of "push and it is handled": when a push goes red, an agent picks it up instead of
  # waiting for someone to notice. Only failures come through — a repo webhook on workflow_run fires on
  # EVERY workflow completion (ci, live-publish, pages-build-deployment, ai-brief…), which is ~50 agent
  # runs a day to say "✅ green". Green is silent; the Actions tab is the history. The signature is the
  # same HMAC-SHA256 GitHub would send, so the relay needs no second code path.
  notify:
    needs: [check, deploy]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Tell the agent
        run: |
          body=$(printf '{"action":"completed","workflow_run":{"id":%s,"name":"ci","conclusion":"failure","head_branch":"%s","head_sha":"%s","html_url":"%s/%s/actions/runs/%s"}}' \
            "${{ github.run_id }}" "${{ github.ref_name }}" "${{ github.sha }}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')"
          curl -sS -m 20 -X POST "https://projectportal.duckdns.org/webhooks/hkcm-ci" \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $sig" \
            -H "X-GitHub-Event: workflow_run" \
            --data "$body" -w '\nHTTP %{http_code}\n'
        env:
          SECRET: ${{ secrets.HERMES_WEBHOOK_SECRET }}
