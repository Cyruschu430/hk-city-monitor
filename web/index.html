<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HK City Monitor · 香港城市監察</title>
<!-- Inline favicon: a request for /favicon.ico that 404s shows up as a console
     error in every verification run and trains people to ignore red text. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305070d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%2322d3ee'/%3E%3C/svg%3E">
<meta name="description" content="香港本土實時情況儀表板 — 全部數據來自香港官方開放數據，每個數字可溯源。開源專案，非政府系統。">
<script>
/* Pre-paint theme. Applying it from main.ts paints the dark default first, so a
   light-theme user sees a black flash on every load. Four lines here remove
   that; src/lib/theme.ts reads the same key and re-applies it once the app is
   up (belt and braces, and it keeps the OS listener in one place). */
try{var t=localStorage.getItem("hkcm.theme")||"system";
document.documentElement.dataset.theme=(t==="light"||(t==="system"&&!matchMedia("(prefers-color-scheme: dark)").matches))?"light":"dark";}catch(e){}
</script>
<script>
/* PWA service worker. Registered on load; guarded so it never throws on
   environments without SW support. The worker itself never caches /data/*. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {});
  });
}
</script>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <!-- PWA: installable, standalone (no browser chrome), splash + icon on the
       home screen. /data/*.json is never cached by sw.js — live snapshots
       must not be served stale. -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#05070d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
<header id="statusbar"></header>
<div id="ticker" hidden></div>
<main id="layout">
  <div id="mapWrap">
    <div id="map" role="application" aria-label="map"></div>
    <!-- Instrument placard, not a page title: World Monitor's map face is
         headed by WHAT you are looking at and WHEN, in the same letter-spaced
         register as a panel铭牌. The status bar above answers "is the system
         healthy"; this answers "what am I looking at, as of when". -->
    <div id="mapHead" aria-hidden="true">
      <span class="mh-scope" data-tc="香港實時情況" data-en="HONG KONG LIVE">香港實時情況</span>
      <span class="mh-clock"></span>
    </div>
    <div id="mapHud"></div>
  </div>
  <aside id="panelCol">
    <nav id="panelTabs" aria-label="categories" hidden></nav>
    <div id="panelRestore" hidden></div>
    <div id="panels" aria-label="panels"></div>
  </aside>
</main>
<div id="drawer" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
